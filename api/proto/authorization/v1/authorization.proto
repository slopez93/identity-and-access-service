syntax = "proto3";

package authorization.v1;

import "common/v1/principal.proto";

option go_package = "github.com/example/identity-access-service/gen/proto/authorization/v1;authorizationv1";

service AuthorizationService {
  rpc AuthorizeTransaction(AuthorizeTransactionRequest) returns (AuthorizationResponse);
}

enum TransactionAction {
  CREATE = 0;
  READ = 1;
  DELETE = 3;
  EXECUTE = 4;
}

message TransactionResource {
  string id = 1;
  string owner_id = 2;
}

message AuthorizeTransactionRequest {
  common.v1.Principal principal = 1;
  TransactionAction action = 2;
  TransactionResource resource = 3;
}

message AuthorizationResponse {
  bool allowed = 1;
  string reason = 2;
}
